name: URBE — pruebas visuales escritorio/móvil
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Interfaz real con API de Render (desktop y móvil)
        run: npm run test:e2e
      - name: Capturas y trazas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-urbe-desktop-mobile
          path: test-results/
          retention-days: 30
