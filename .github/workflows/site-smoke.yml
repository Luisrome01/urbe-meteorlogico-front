name: URBE — sitio publicado y CORS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar Render público, logo, bundle actualizado, API y CORS
        run: node scripts/smoke-site.mjs
